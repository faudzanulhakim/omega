<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0d1f1a"/>
      <stop offset="100%" stop-color="#050a08"/>
    </radialGradient>
    <linearGradient id="omega" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded dark badge -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#123a2e" stroke-width="2"/>

  <!-- radar rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#0f2c23" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#124233" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#155843" stroke-width="1.5" stroke-dasharray="6 10"/>
  <!-- sweep -->
  <path d="M256 256 L256 60 A196 196 0 0 1 400 106 Z" fill="#00ff9d" opacity="0.06"/>
  <line x1="256" y1="256" x2="400" y2="106" stroke="#00ff9d" stroke-width="2" opacity="0.5"/>

  <!-- target ticks -->
  <g stroke="#1d6b52" stroke-width="2">
    <line x1="256" y1="44" x2="256" y2="62"/><line x1="256" y1="450" x2="256" y2="468"/>
    <line x1="44" y1="256" x2="62" y2="256"/><line x1="450" y1="256" x2="468" y2="256"/>
  </g>

  <!-- OMEGA glyph -->
  <g filter="url(#glow)">
    <text x="256" y="340" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
          font-size="280" fill="url(#omega)">&#937;</text>
  </g>

  <!-- terminal underline -->
  <rect x="156" y="386" width="200" height="6" rx="3" fill="#00ff9d" opacity="0.85"/>
  <text x="256" y="432" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="30"
        letter-spacing="14" fill="#7ee8c8">OMEGA</text>
</svg>
